<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokeflex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search"/>
</head>

<body>
<div id="bgr_change">
    <span class="big_text">Change Background</span>
    <span class="short_text">background</span>
    <span class="xs_text">bgr</span>
</div>
<div id="clear_pokemons">
    <span class="big_text">Clear All</span>
    <span class="short_text">Clear All</span>
    <span class="xs_text">Clear</span>
</div>
<div id="remove_1" class="hidden">
    <span class="big_text">Remove Pokémon</span>
    <span class="short_text">Remove PKMN</span>
    <span class="xs_text">Remove</span>
</div>
<div id="shiny_button" class="hidden">
    <span class="big_text">Shiny toggle</span>
    <span class="short_text">Shiny</span>
    <span class="xs_text">Shiny</span>
</div>
<div id="search" class="hidden">
    <span class="material-symbols-outlined">
        search
    </span>
    <input id="search_input" placeholder="Search Pokémon...">
    <div id="search_button">Search</div>
</div>

<div id="main">
    <div id="mons">
        <div id="mons_row1">
            <div id="box1" class="box">Search a Pokémon</div>
            <div id="box2" class="box">Search a Pokémon</div>
            <div id="box3" class="box">Search a Pokémon</div>
        </div>

        <div id="mons_row2">
            <div id="box4" class="box">Search a Pokémon</div>
            <div id="box5" class="box">Search a Pokémon</div>
            <div id="box6" class="box">Search a Pokémon</div>
        </div>
    </div>

    <div id="characters">
        <img id="character" src="Characters/red-gen3.png" alt="Pokémon trainer sprite">
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
